<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>便笺 · 逐题去留核对</title><style>body{font:16px/1.7 system-ui;background:#f5f1e8;color:#243a30;max-width:960px;margin:24px auto;padding:0 18px}a{color:#235d42}input,select,button{font:inherit;padding:9px;max-width:100%;margin:4px}article{background:white;border:1px solid #ddd;padding:16px;margin:12px 0;border-radius:12px}small{color:#58635c}.links{display:flex;flex-wrap:wrap;gap:12px}</style><a href="../">← 返回便笺</a><h1>逐题去留 · 2026-11-22 v2</h1><p>按实际内容和规章归属核对；公共知识归党口。5,484 个原编号纳入，4,583 个保留待核，直接判为范围外 0 条。原题总数 10,067 不变。</p><p>证据分级：公共知识归类、原件标注出处、历史原文实质匹配、已复审归属、待核。候选片段只作线索，不全称已核实；归属确认不等于答案或2026现行版本已核。</p><div class="links"><a href="逐题去留.csv" download>全部逐题清单</a><a href="公共知识.csv" download>党口及公共知识</a><a href="待核.csv" download>归属待核清单</a><a href="缺图条件及未保留原编号46条.csv" download>缺图及未映射46条</a><a href="原有合并映射401条.csv" download>既有去重401条</a><a href="缺失材料.md">缺失材料和限制</a></div><h2>原题检索</h2><input id="search" placeholder="原编号、题文或出处"><select id="status"><option value="">全部</option><option value="core">已纳入</option><option value="pending">归属待核</option></select><select id="subject"><option value="">全部科目</option><option value="party">党口与公共知识</option><option value="technical">技规（含高速）</option><option value="operation">机车运用</option><option value="transport-dispatch">运输调度</option><option value="loco-dispatch">机车调度</option><option value="accident">事故调查</option><option value="rescue">应急救援</option></select><p id="count">载入清单…</p><div id="list"></div><button id="more" hidden>继续显示50条</button><script>
let rows=[],shown=50;const labels={'core':'已纳入','pending':'归属待核','content-classification':'公共知识归类','original-citation':'原件标注，原文待核','substantive-text-match':'历史原文实质匹配','reviewed-attribution':'已复审归属','unresolved':'待核'};const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function render(){const term=document.querySelector('#search').value.trim(),status=document.querySelector('#status').value,subject=document.querySelector('#subject').value;const hits=rows.filter(e=>(!status||e.status===status)&&(!subject||e.subjects.includes(subject))&&(!term||[e.id,e.q,e.citation].join(' ').includes(term)));document.querySelector('#count').textContent='找到 '+hits.length+' 个原编号 · 显示前 '+Math.min(shown,hits.length)+' 条';document.querySelector('#list').innerHTML=hits.slice(0,shown).map(e=>'<article><b>'+esc(e.id)+' · '+esc(labels[e.status])+'</b><p>'+esc(e.q)+'</p><small>'+esc(labels[e.level])+' · '+esc(e.reason)+'</small>'+(e.citation?'<p>原件标注：'+esc(e.citation)+'</p>':'')+'</article>').join('');document.querySelector('#more').hidden=hits.length<=shown}document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',()=>{shown=50;render()}));document.querySelector('#more').onclick=()=>{shown+=50;render()};fetch('review-index.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{rows=data;render()}).catch(()=>document.querySelector('#count').textContent='载入失败，请使用上方CSV完整清单');</script></html>
